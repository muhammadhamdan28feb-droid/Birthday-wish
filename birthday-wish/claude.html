<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#FFE3EF" />
<title>A Little Surprise For You 🎁</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<style>

/* ============================================================
   EDITABLE — see CONFIG object in the <script> at the bottom
   for messages, bestie name, and music file.
   ============================================================ */

:root{
  --cream:#FFF8F3;
  --blush:#FFD9EC;
  --blush-soft:#FFEAF4;
  --rose:#FF6FA0;
  --rose-deep:#E84B86;
  --lavender:#E7DEFF;
  --ink:#3E2E3B;
  --ink-soft:#7A6572;
  --gold:#FFC857;
  --mint:#BFF3D8;
  --white:#FFFFFF;
  --shadow: 0 20px 50px -12px rgba(232, 75, 134, 0.28);
}

*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html,body{
  margin:0; padding:0; height:100%; overflow:hidden;
  background: linear-gradient(160deg, var(--cream) 0%, var(--blush-soft) 45%, var(--lavender) 100%);
  font-family:'Nunito', sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  touch-action: manipulation;
}
#app{ position:relative; width:100%; height:100dvh; height:100vh; overflow:hidden; }

h1,h2,h3, .display{ font-family:'Fredoka', sans-serif; font-weight:600; }

button{ font-family:inherit; border:none; background:none; cursor:pointer; }

/* ---------- Ambient floating background ---------- */
#ambient{ position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:1; }
.floaty{
  position:absolute; bottom:-10%; font-size:22px; opacity:0.55;
  animation: floatUp linear infinite;
  filter: drop-shadow(0 2px 6px rgba(232,75,134,0.15));
}
@keyframes floatUp{
  0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
  8%{ opacity:0.6; }
  50%{ transform: translateY(-55vh) translateX(15px) rotate(15deg); }
  92%{ opacity:0.5; }
  100%{ transform: translateY(-110vh) translateX(-10px) rotate(-10deg); opacity:0; }
}

.blob{ position:absolute; border-radius:50%; filter:blur(40px); opacity:0.5; z-index:0; }
.blob-1{ width:280px; height:280px; background:var(--blush); top:-60px; left:-60px; }
.blob-2{ width:320px; height:320px; background:var(--lavender); bottom:-80px; right:-80px; }
.blob-3{ width:200px; height:200px; background:var(--mint); top:40%; right:-60px; opacity:0.35;}

/* ---------- Screen stage ---------- */
#stage{ position:relative; z-index:2; width:100%; height:100%; }

.screen{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  padding: 6vh 20px 4vh;
  opacity:0; pointer-events:none;
  transform: scale(0.85) rotateY(-8deg);
  transition: opacity 0.55s cubic-bezier(.34,1.56,.64,1), transform 0.6s cubic-bezier(.34,1.56,.64,1);
  transform-style: preserve-3d;
}
.screen.active{
  opacity:1; pointer-events:auto; transform: scale(1) rotateY(0deg);
  z-index:5;
}
.screen.leaving{
  opacity:0; transform: scale(0.9) rotateY(10deg) translateY(-10px);
  transition: opacity 0.4s ease, transform 0.45s ease;
  z-index:4;
}

/* ---------- Cat stage ---------- */
.cat-stage{
  position:relative; width:100%; max-width:420px; height:34vh; min-height:190px;
  display:flex; align-items:flex-end; justify-content:center; margin-bottom:2vh;
}
.cat-wrap{
  position:absolute; bottom:0; width:150px; transition: left 0.6s cubic-bezier(.34,1.2,.64,1), right 0.6s cubic-bezier(.34,1.2,.64,1), transform 0.5s ease;
}
.cat-wrap svg{ width:100%; height:auto; display:block; filter: drop-shadow(0 12px 14px rgba(62,46,59,0.18)); }
.cat-extra{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px;
  pointer-events:none;
  text-shadow: 0 2px 8px rgba(255,255,255,0.8);
}
.cat-extra.superhero{ font-size:24px; }
.cat-extra.glasses{ font-size:22px; }
.cat-extra.merida{ font-size:20px; color:#E84B86; }
.cat-extra.music{ font-size:22px; }
.cat-extra.books{ font-size:18px; }
.cat-extra.flowers{ font-size:18px; }
.cat-extra.code{ font-size:18px; }
 
.pos-center{ left:50%; transform:translateX(-50%); }
.pos-left{ left:18%; }
.pos-right{ right:18%; }
.pos-hide{ opacity:0; transform: translateY(30px) scale(0.7); pointer-events:none; }

.anim-peek{ animation: catPeek 0.7s cubic-bezier(.34,1.56,.64,1) both; }
.anim-idle{ animation: catIdle 3.2s ease-in-out infinite; }
.anim-bounce{ animation: catBounce 1.1s ease-in-out infinite; }
.anim-wiggle{ animation: catWiggle 1.6s ease-in-out infinite; }
.anim-dance{ animation: catDance 0.9s ease-in-out infinite; }
.anim-walk{ animation: catWalk 1.8s ease-in-out infinite; }
.anim-present{ animation: catBounce 1.4s ease-in-out infinite; }

@keyframes catPeek{
  0%{ transform: translateY(50px) scale(0.75) rotate(-4deg); opacity:0; }
  65%{ transform: translateY(-8px) scale(1.04) rotate(2deg); opacity:1; }
  100%{ transform: translateY(0) scale(1) rotate(0deg); }
}
@keyframes catIdle{ 0%,100%{ transform: translateY(0) rotate(-1deg);} 50%{ transform: translateY(-6px) rotate(1deg);} }
@keyframes catBounce{ 0%,100%{ transform: translateY(0) rotate(-2deg);} 50%{ transform: translateY(-16px) rotate(3deg);} }
@keyframes catWiggle{ 0%,100%{ transform: rotate(-4deg);} 50%{ transform: rotate(4deg);} }
@keyframes catDance{ 0%,100%{ transform: rotate(-7deg) translateX(-6px);} 50%{ transform: rotate(7deg) translateX(6px);} }
@keyframes catWalk{ 0%,100%{ transform: translateX(-8px) rotate(-2deg);} 50%{ transform: translateX(8px) rotate(2deg);} }

.held-heart{
  position:absolute; left:-6px; top:18%; font-size:26px;
  animation: heldPulse 1.1s ease-in-out infinite; transform-origin:center;
  filter: drop-shadow(0 4px 6px rgba(232,75,134,0.3));
}
@keyframes heldPulse{ 0%,100%{ transform: scale(1) rotate(-8deg);} 50%{ transform: scale(1.18) rotate(4deg);} }

.cake-wrap{
  position:absolute; bottom:2px; left:50%; transform:translateX(-50%) scale(0.001);
  width:150px; transition:none; opacity:0;
}
.cake-wrap.show{
  animation: cakePop 0.9s cubic-bezier(.34,1.56,.64,1) forwards;
}
@keyframes cakePop{
  0%{ opacity:0; transform:translateX(-50%) scale(0.2) translateY(30px) rotate(-8deg); }
  60%{ opacity:1; transform:translateX(-50%) scale(1.08) translateY(-6px) rotate(3deg); }
  100%{ opacity:1; transform:translateX(-50%) scale(1) translateY(0) rotate(0deg); }
}
.cake-wrap svg{ width:100%; height:auto; filter: drop-shadow(0 14px 16px rgba(232,75,134,0.28)); }
.flame{ transform-origin: center bottom; animation: flicker 0.55s ease-in-out infinite alternate; }
.flame:nth-child(2){ animation-delay:0.12s; }
.flame:nth-child(3){ animation-delay:0.22s; }
@keyframes flicker{
  0%{ transform: scaleY(1) scaleX(1) rotate(-2deg); opacity:1; }
  100%{ transform: scaleY(1.15) scaleX(0.9) rotate(2deg); opacity:0.85; }
}

/* ---------- Message card ---------- */
.card{
  position:relative; width:100%; max-width:440px;
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.9);
  border-radius: 28px;
  padding: 30px 26px 26px;
  box-shadow: var(--shadow);
  text-align:center;
  cursor:pointer;
  user-select:none;
}
.card::before{
  content:''; position:absolute; inset:0; border-radius:28px; padding:1.5px;
  background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,111,160,0.35));
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor; mask-composite: exclude;
  pointer-events:none;
}
.eyebrow{
  font-size:12px; letter-spacing:0.14em; text-transform:uppercase; font-weight:800;
  color:var(--rose-deep); margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:8px;
}
.msg-text{
  font-size: clamp(19px, 5vw, 25px); line-height:1.5; font-weight:700; color:var(--ink);
  white-space:pre-line;
}
.msg-text.big{ font-family:'Fredoka', sans-serif; font-size: clamp(26px, 7.5vw, 40px); line-height:1.25; }

.tap-hint{
  margin-top:16px; font-size:13px; color:var(--ink-soft); font-weight:700;
  opacity:0; animation: hintFade 1.6s ease-in-out 0.9s infinite;
}
.card-action-btn{
  margin-top:20px;
  background: linear-gradient(135deg, rgba(255,111,160,0.95), rgba(255,200,230,0.95));
  border-radius:999px;
  color:#fff;
  font-size:14px;
  padding:12px 22px;
  font-weight:800;
  box-shadow: 0 12px 26px -14px rgba(232,75,134,0.35);
}
.card-action-btn:active{ transform:scale(0.97); }
@keyframes hintFade{ 0%,100%{ opacity:0.35;} 50%{ opacity:0.9;} }
 
/* ---------- Progress dots ---------- */
.progress{ display:flex; gap:8px; margin-top:22px; }
.dot{ width:8px; height:8px; border-radius:50%; background: rgba(232,75,134,0.22); transition: all 0.35s ease; }
.dot.done{ background: var(--rose); width:8px; }
.dot.current{ background: var(--rose-deep); width:22px; border-radius:6px; }
.counter{
  margin-top:10px; font-size:12px; font-weight:800; color:var(--ink-soft); letter-spacing:0.05em;
}

/* ---------- Welcome screen ---------- */
#screen-welcome{ justify-content:center; gap:0; }
.welcome-badge{
  font-size:13px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase;
  color:var(--rose-deep); background:rgba(255,255,255,0.7); padding:8px 18px; border-radius:999px;
  margin-bottom:18px; box-shadow: 0 8px 20px -8px rgba(232,75,134,0.3);
}
.welcome-title{
  font-size: clamp(30px, 9vw, 46px); text-align:center; line-height:1.15; margin:0 0 10px;
  color:var(--ink);
}
.welcome-title span{ color:var(--rose-deep); }
.welcome-sub{ text-align:center; color:var(--ink-soft); font-weight:700; font-size:15px; margin-bottom:8px; max-width:320px;}

.start-btn{
  margin-top:26px; position:relative;
  background: linear-gradient(135deg, var(--rose), var(--rose-deep));
  color:#fff; font-weight:800; font-size:17px; font-family:'Fredoka',sans-serif;
  padding:16px 38px; border-radius:999px;
  box-shadow: 0 16px 32px -10px rgba(232,75,134,0.55);
  animation: startPulse 1.8s ease-in-out infinite;
}
@keyframes startPulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.045);} }
.start-btn:active{ transform:scale(0.96); }

/* ---------- Final screen ---------- */
#screen-final .msg-text{ color:var(--ink); }
.final-heading{
  font-family:'Fredoka',sans-serif; font-size:clamp(28px,8vw,44px); text-align:center;
  background: linear-gradient(135deg, var(--rose-deep), var(--rose), var(--gold));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin: 4px 0 12px; line-height:1.15;
}
.replay-btn{
  margin-top:18px; background: rgba(255,255,255,0.85); color:var(--rose-deep);
  font-weight:800; font-family:'Fredoka',sans-serif; font-size:15px;
  padding:12px 26px; border-radius:999px; box-shadow: 0 10px 24px -10px rgba(232,75,134,0.4);
  border: 1.5px solid rgba(232,75,134,0.25);
}
.replay-btn:active{ transform:scale(0.96); }

/* ---------- Music control ---------- */
#music-btn{
  position:fixed; top:max(16px, env(safe-area-inset-top)); right:16px; z-index:50;
  width:48px; height:48px; border-radius:50%;
  background: rgba(255,255,255,0.8); backdrop-filter: blur(10px);
  display:flex; align-items:center; justify-content:center; font-size:20px;
  box-shadow: 0 10px 22px -8px rgba(62,46,59,0.25);
  opacity:0; pointer-events:none; transition: opacity 0.4s ease, transform 0.2s ease;
}
#music-btn.show{ opacity:1; pointer-events:auto; }
#music-btn:active{ transform:scale(0.9); }
#music-btn.playing .note{ animation: noteBob 0.7s ease-in-out infinite; }
@keyframes noteBob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-3px);} }

/* ---------- Confetti canvas ---------- */
#confetti{ position:fixed; inset:0; z-index:40; pointer-events:none; }

/* ---------- Responsive tweaks ---------- */
@media (max-width:380px){
  .cat-stage{ height:30vh; min-height:150px; }
  .cat-wrap{ width:120px; }
  .cake-wrap{ width:120px; }
  .card{ padding:24px 20px 22px; border-radius:24px; }
}
@media (min-height:800px){
  .cat-stage{ height:38vh; }
}
@media (prefers-reduced-motion: reduce){
  *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
}
</style>
</head>
<body>

<div id="app">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
  <div id="ambient"></div>

  <button id="music-btn" aria-label="Toggle music">
    <span class="note">🔇</span>
  </button>

  <div id="stage">

    <!-- WELCOME SCREEN -->
    <section class="screen active" id="screen-welcome">
      <div class="cat-stage" id="welcome-cat-stage">
        <!-- cats injected by JS -->
      </div>
      <div class="welcome-badge">A little something for you</div>
      <h1 class="welcome-title">Hey <span id="welcome-name">Bestie</span>... 👀❤️<br/>I made something special for you.</h1>
      <p class="welcome-sub">Tap the button and reveal your surprise one little chapter at a time.</p>
      <button class="start-btn" id="start-btn">Open Your Surprise 🎁</button>
    </section>

    <!-- MESSAGE SCREENS injected by JS -->
    <div id="message-screens"></div>

  </div>
</div>

<canvas id="confetti"></canvas>

<script>
/* ============================================================
   EDIT ME — everything you'll want to personalize lives here.
   ============================================================ */
const CONFIG = {
  bestieName: "Bestie",

  // Add / remove / edit messages freely. Each needs a "cats" state
  // (see CAT_STATES below) that controls what the cats do on that screen.
  // The LAST message in this array is always treated as the final,
  // cake-reveal screen.
  messages: [
    { eyebrow: "psst...", text: "Hey Bestie! 👀\nI made something special just for you...", cats: "bw-peek" },
    { eyebrow: "open your surprise", text: "Tap the gift and reveal your surprise one little chapter at a time.", cats: "white-heart" },
    { eyebrow: "ready?", text: "Every tap opens a new message, a new memory, a new smile. Let’s go. ❤️", cats: "both-idle" },

    { eyebrow: "our first meeting", text: "Do you remember how we first met? ❤️", cats: "bw-think" },
    { eyebrow: "first impression", text: "Mujhe abhi bhi yaad hai k ap ko kitna chalwaya tha first time milne k leay...", cats: "white-idle" },
    { eyebrow: "unexpected beginning", text: "Us waqt kahan pata tha ke yeh simple si mulaqat itni khubsurat dosti ban jayegi. 🥹", cats: "both-heart" },
    { eyebrow: "rainy surprise", text: "Aur phir... woh achanak wali baarish. 🌧️", cats: "bw-surprise" },
    { eyebrow: "small coincidence", text: "Maybe it was just rain... lekin yeh chhoti si baarish hamari story ka ek special hissa ban gayi. ❤️", cats: "white-walk" },

    { eyebrow: "lunch box", text: "mera favourite khana lunch box mein laati thi. 🍱", cats: "white-hungry" },
    { eyebrow: "forgetful", text: "Aur sabse funny? lunch box wapas lena bhool jaati thi! 😭😂", cats: "bw-confused" },
    { eyebrow: "biryani", text: "Aur haan... woh biryani wali baat main kabhi nahi bhool sakta. 😂🍛", cats: "bw-joy" },

    { eyebrow: "your caring side", text: "Some stories are not meant to be told to everyone...", cats: "bw-listen" },
    { eyebrow: "trusted you", text: "Lekin mujhe pata tha ke main meri har baat ap k paas safe chhor sakta hoon. 🤍", cats: "white-caring" },
    { eyebrow: "support", text: "ap mujhe har step par samjha aur support kiya.", cats: "both-caring" },
    { eyebrow: "grateful", text: "Yeh sabse pyari quality hai, aur main hamesha iska shukriya ada karunga.", cats: "both-heart" },

    { eyebrow: "funny names", text: "mujhe ajeeb aur cute names deti hn, jo har baar smile karwate hain.", cats: "bw-smile" },
    { eyebrow: "batman", text: "Kabhi Batman 🦇...", cats: "bw-superhero" },
    { eyebrow: "professor", text: "Kabhi Professor 🤓...", cats: "white-glasses" },
    { eyebrow: "favorite name", text: "Sach poocho to Professor mera sabse favourite name hai! 😂❤️", cats: "bw-dance" },
    { eyebrow: "merida", text: "Phir m ap ko Merida 🏹, adventure aur red-curly energy ke saath.", cats: "both-merida" },
    { eyebrow: "melody", text: "Aur Melody 🎶, jise sun ke main seedha dance karna chahta hoon.", cats: "both-melody" },

    { eyebrow: "your story", text: "Phir mujha ap ki story ka twist mila.", cats: "white-story" },
    { eyebrow: "every detail", text: "Main har choti baat mein genuinely interested ho gaya.", cats: "bw-listen" },
    { eyebrow: "mano", text: "Jab ap ne Mano ke baare mein bataya... main literally pighal gaya tha. 🥹❤️", cats: "white-blush" },
    { eyebrow: "simba", text: "Aur jab mera Simba aaya, ap bhi us par fida ho gayi thi. 😂🐱❤️", cats: "both-cute" },
    { eyebrow: "friendship", text: "Shayad dosti ka matlab yahi hai... ek dusre ki kahani mein dhire dhire ghul jana.", cats: "both-heart" },

    { eyebrow: "different worlds", text: "Hum dono kitne alag hain...", cats: "bw-coding" },
    { eyebrow: "coding life", text: "Main code, functions, bugs... 💻", cats: "bw-coding" },
    { eyebrow: "book world", text: "Aur ap novels, stories, characters ki duniya mein. 📚", cats: "white-books" },
    { eyebrow: "flowers", text: "Aur 70 phoolon ke names yaad rakhna? Seriously, yeh pura fiction lagta hai. 🌸✨", cats: "white-flowers" },
    { eyebrow: "same friendship", text: "Different worlds... phir bhi ek hi dosti. ❤️", cats: "both-worlds" },

    { eyebrow: "just a few", text: "Aur yeh sirf kuch yaadein thi jo maine aaj ap k saath share ki.", cats: "both-idle" },
    { eyebrow: "so many more", text: "Because honestly... there are so many more. ❤️", cats: "both-heart" },
    { eyebrow: "one more surprise", text: "But before this gets too emotional... 😂", cats: "bw-anticipate" },
    { eyebrow: "one last surprise", text: "We still have one more surprise for you... 👀🎁", cats: "both-peek", actionLabel: "One Last Surprise →" },

    { eyebrow: "happy birthday", text: "Happy Birthday, Bestie! ❤️🎂\n\nFrom that first meeting...\nto that unexpected baarish...\n\nFrom lunch boxes and biryani...\nto Batman, Professor, Merida and Melody...\n\nFrom sharing stories...\nto knowing each other's little worlds...\n\nWe've collected so many little memories together.\n\nAnd honestly, I hope this is only the beginning.\n\nI hope life gives you endless reasons to smile,\nlots of happiness,\nsuccess in everything you do,\nand many more beautiful moments.\n\nStay the same amazing, caring, unique, and slightly crazy person you are. 😂❤️\n\nAnd no matter how many years pass...\n\nI hope we keep making more memories,\nmore stories,\nmore inside jokes,\nand more crazy moments together.\n\nHappy Birthday to one of the most special people in my life.\n\nHappy Birthday, Bestie! 🥹❤️🎂✨", cats: "final-cake", finalHeading: "HAPPY BIRTHDAY, BESTIE! 🎂❤️✨" }
  ],

  // Leave empty to disable music, or point to your own mp3 file, e.g. "my-song.mp3"
  musicSrc: ""
};

/* CAT_STATES — how the two cats behave on each named state above.
   pos: 'center' | 'left' | 'right' | 'hide'
   anim: 'peek' | 'idle' | 'bounce' | 'wiggle' | 'dance' | 'walk' | 'present'
   hold: null | 'heart' (small heart the white cat holds) */
const CAT_STATES = {
  "bw-peek":       { bw:{pos:'center', anim:'peek'},     white:{pos:'hide'},                     cake:false },
  "white-heart":   { bw:{pos:'hide'},                    white:{pos:'center', anim:'idle', hold:'heart'}, cake:false },
  "both-idle":     { bw:{pos:'left', anim:'idle'},       white:{pos:'right', anim:'idle'},       cake:false },
  "bw-think":      { bw:{pos:'center', anim:'idle'},     white:{pos:'hide'},                     cake:false },
  "white-idle":    { bw:{pos:'hide'},                    white:{pos:'center', anim:'idle'},     cake:false },
  "both-heart":    { bw:{pos:'left', anim:'idle'},       white:{pos:'right', anim:'idle'},       cake:false },
  "bw-surprise":   { bw:{pos:'center', anim:'peek'},     white:{pos:'hide'},                     cake:false },
  "white-walk":    { bw:{pos:'left', anim:'idle'},       white:{pos:'right', anim:'walk'},       cake:false },
  "white-hungry":  { bw:{pos:'left', anim:'idle'},       white:{pos:'center', anim:'bounce'},    cake:false },
  "bw-confused":   { bw:{pos:'center', anim:'wiggle'},   white:{pos:'hide'},                     cake:false },
  "both-hungry":   { bw:{pos:'left', anim:'idle'},       white:{pos:'right', anim:'peek'},       cake:false },
  "bw-joy":        { bw:{pos:'center', anim:'bounce'},   white:{pos:'hide'},                     cake:false },
  "bw-listen":     { bw:{pos:'left', anim:'idle'},       white:{pos:'right', anim:'idle'},       cake:false },
  "white-caring":  { bw:{pos:'hide'},                    white:{pos:'center', anim:'idle', hold:'heart'}, cake:false },
  "both-caring":   { bw:{pos:'left', anim:'idle'},       white:{pos:'right', anim:'idle'},       cake:false },
  "bw-smile":      { bw:{pos:'center', anim:'idle'},     white:{pos:'hide'},                     cake:false },

/* ============================================================
   Build DOM for message screens
   ============================================================ */
const total = CONFIG.messages.length;
const messagesContainer = document.getElementById('message-screens');

CONFIG.messages.forEach((m, i) => {
  const isFinal = i === total - 1;
  const screen = document.createElement('section');
  screen.className = 'screen';
  screen.id = 'screen-msg-' + i;

  const dots = CONFIG.messages.map((_, di) =>
    `<span class="dot ${di < i ? 'done' : ''} ${di === i ? 'current' : ''}"></span>`
  ).join('');

  screen.innerHTML = `
    <div class="cat-stage" id="cat-stage-${i}"></div>
    <div class="card" data-advance="1">
      ${isFinal
        ? `<div class="eyebrow">${m.eyebrow || ''}</div><h2 class="final-heading">${m.finalHeading || 'Happy Birthday!'}</h2><div class="msg-text">${escapeText(m.text)}</div>`
        : `<div class="eyebrow">${m.eyebrow || ''}</div><div class="msg-text ${m.big ? 'big' : ''}">${escapeText(m.text)}</div>`
      }
      <div class="tap-hint">${isFinal ? 'tap for a surprise ✨' : (m.actionLabel ? 'tap the button to continue →' : 'tap to continue →')}</div>
      ${m.actionLabel ? `<button class="card-action-btn" data-action-index="${i}">${m.actionLabel}</button>` : ''}
    </div>
    <div class="progress">${dots}</div>
    <div class="counter">${i+1} / ${total}</div>
    ${isFinal ? `<button class="replay-btn" id="replay-btn">Replay Our Story 🔄❤️</button>` : ''}
  `;
  messagesContainer.appendChild(screen);
});

function escapeText(t){
  const div = document.createElement('div');
  div.innerText = t;
  return div.innerHTML;
}

document.getElementById('welcome-name').textContent = CONFIG.bestieName;

/* ============================================================
   Render cats into a given cat-stage element for a given state
   ============================================================ */
function renderCatStage(el, stateKey){
  const state = CAT_STATES[stateKey] || CAT_STATES['both-idle'];
  const bw = state.bw || { pos:'hide' };
  const wh = state.white || { pos:'hide' };

  const posClass = p => p.pos === 'hide' ? 'pos-hide' : ('pos-' + p.pos);
  const animClass = p => p.anim ? ('anim-' + p.anim) : '';

  el.innerHTML = `
    <div class="cat-wrap ${posClass(bw)} ${animClass(bw)}" id="cat-bw">
      ${catSVG('bw')}
      ${bw.extra ? `<div class="cat-extra ${bw.extra}">${extraLabel(bw.extra)}</div>` : ''}
    </div>
    <div class="cat-wrap ${posClass(wh)} ${animClass(wh)}" id="cat-white">
      ${catSVG('white')}
      ${wh.hold === 'heart' ? heartHold() : ''}
      ${wh.extra ? `<div class="cat-extra ${wh.extra}">${extraLabel(wh.extra)}</div>` : ''}
    </div>
    ${state.cake ? `<div class="cake-wrap" id="cake-el">${cakeSVG()}</div>` : ''}
  `;

  if(state.cake){
    requestAnimationFrame(() => {
      const cake = el.querySelector('#cake-el');
      if(cake){
        setTimeout(() => cake.classList.add('show'), 250);
      }
    });
  }
}

// Welcome screen starts with the black & white cat peeking
renderCatStage(document.getElementById('welcome-cat-stage'), 'bw-peek');

// Render each message screen's cat stage
CONFIG.messages.forEach((m, i) => {
  renderCatStage(document.getElementById('cat-stage-' + i), m.cats);
});

/* ============================================================
   Navigation logic
   ============================================================ */
let currentIndex = -1; // -1 = welcome
const welcomeScreen = document.getElementById('screen-welcome');
const allMsgScreens = Array.from(document.querySelectorAll('[id^="screen-msg-"]'));

function goTo(index){
  const outgoing = currentIndex === -1 ? welcomeScreen : document.getElementById('screen-msg-' + currentIndex);
  currentIndex = index;
  const incoming = index === -1 ? welcomeScreen : document.getElementById('screen-msg-' + index);

  if(outgoing && outgoing !== incoming){
    outgoing.classList.remove('active');
    outgoing.classList.add('leaving');
    setTimeout(() => outgoing.classList.remove('leaving'), 450);
  }
  incoming.classList.add('active');

  if(index >= 0){
    const stateKey = CONFIG.messages[index].cats;
    // re-trigger cake pop / entrance animations each visit
    renderCatStage(document.getElementById('cat-stage-' + index), stateKey);
  }

  if(index === total - 1){
    launchConfetti();
  }
}

document.getElementById('start-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  ensureMusicStarted();
  goTo(0);
});

allMsgScreens.forEach((screen, i) => {
  const card = screen.querySelector('.card');
  card.addEventListener('click', (event) => {
    if(event.target.closest('.card-action-btn')) return;
    if(i < total - 1 && !card.querySelector('.card-action-btn')){
      goTo(i + 1);
    }
  });
  const actionBtn = card.querySelector('.card-action-btn');
  if(actionBtn){
    actionBtn.addEventListener('click', (event) => {
      event.stopPropagation();
      if(i < total - 1){
        goTo(i + 1);
      }
    });
  }
});

// Replay button
document.addEventListener('click', (e) => {
  if(e.target && e.target.id === 'replay-btn'){
    e.stopPropagation();
    goTo(-1);
  }
});

/* ============================================================
   Ambient floating hearts / sparkles background
   ============================================================ */
const ambient = document.getElementById('ambient');
const floatyEmojis = ['💗','✨','⭐','💫','🩷'];
function spawnFloaty(){
  const s = document.createElement('span');
  s.className = 'floaty';
  s.textContent = floatyEmojis[Math.floor(Math.random()*floatyEmojis.length)];
  const size = 14 + Math.random()*16;
  s.style.left = (Math.random()*100) + '%';
  s.style.fontSize = size + 'px';
  const duration = 9 + Math.random()*8;
  s.style.animationDuration = duration + 's';
  ambient.appendChild(s);
  setTimeout(() => s.remove(), duration*1000 + 200);
}
for(let i=0;i<6;i++){ setTimeout(spawnFloaty, i*900); }
setInterval(spawnFloaty, 1400);

/* ============================================================
   Music controls (no autoplay — user gesture required)
   ============================================================ */
let audio = null;
let musicOn = false;
const musicBtn = document.getElementById('music-btn');

function ensureMusicStarted(){
  if(!CONFIG.musicSrc) return; // no track configured — button stays hidden
  if(!audio){
    audio = new Audio(CONFIG.musicSrc);
    audio.loop = true;
    audio.volume = 0.5;
  }
  musicBtn.classList.add('show');
}

musicBtn.addEventListener('click', () => {
  if(!audio) return;
  if(musicOn){
    audio.pause();
    musicOn = false;
    musicBtn.classList.remove('playing');
    musicBtn.querySelector('.note').textContent = '🔇';
  } else {
    audio.play().catch(()=>{});
    musicOn = true;
    musicBtn.classList.add('playing');
    musicBtn.querySelector('.note').textContent = '🎵';
  }
});

// If a track is configured, reveal the music button once the user starts.
if(CONFIG.musicSrc){
  musicBtn.classList.remove('show');
} else {
  musicBtn.style.display = 'none';
}

/* ============================================================
   Confetti (lightweight canvas implementation, no dependencies)
   ============================================================ */
const canvas = document.getElementById('confetti');
const ctx = canvas.getContext('2d');
function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const confettiColors = ['#FF6FA0','#FFC857','#B9A6FF','#8CD9B3','#FF9FC0','#FFFFFF'];
let confettiParticles = [];
let confettiRunning = false;

function launchConfetti(){
  const count = 90;
  for(let i=0;i<count;i++){
    confettiParticles.push({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*canvas.height*0.3,
      w: 6 + Math.random()*6,
      h: 8 + Math.random()*8,
      color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
      speedY: 2 + Math.random()*3,
      speedX: (Math.random()-0.5)*2,
      rotation: Math.random()*360,
      rotSpeed: (Math.random()-0.5)*10,
      life: 0,
      maxLife: 260 + Math.random()*120
    });
  }
  if(!confettiRunning){
    confettiRunning = true;
    requestAnimationFrame(confettiTick);
  }
}

function confettiTick(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  confettiParticles.forEach(p => {
    p.y += p.speedY;
    p.x += p.speedX + Math.sin(p.y*0.02);
    p.rotation += p.rotSpeed;
    p.life++;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rotation * Math.PI/180);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, 1 - p.life/p.maxLife);
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();
  });
  confettiParticles = confettiParticles.filter(p => p.life < p.maxLife && p.y < canvas.height + 40);
  if(confettiParticles.length > 0){
    requestAnimationFrame(confettiTick);
  } else {
    confettiRunning = false;
  }
}

/* Gentle confetti trickle also fires on the "dance" beat screen for fun */
